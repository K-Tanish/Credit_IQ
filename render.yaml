services:
  - type: web
    name: credit-iq-api
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile.backend
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credit-iq-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: credit-iq-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: credit-iq-db
    plan: 0.5c-1g
    databaseName: credit_iq
    user: credit_iq_user
    ipAllowList: []